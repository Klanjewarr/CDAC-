<!DOCTYPE html>
<html lang="en">

<head>
    <title>Student Mangement System</title>
</head>

<body>
    <script>
        const studentName = {
           
                sname:"Rahul",
                rollno:"47",
                course:"Web Development",
                s1 :"HTML",
                s2 :"CSS",
                s3 :"JavaScript",
                sub1:12,
                sub2:22,
                sub3:32,
            showTotal: function () {
                 return this.sub1 + this.sub2 + this.sub3;
                
            },
            showPercentage: function () {
            let a= this.showTotal()
            const percentage=(a/300)*100
            return (percentage)
            },
        showGrades: function () {
        const percentage = this.showPercentage();
        if (percentage >= 90) return "A+";
        else if (percentage >= 80) return "A";
        else if (percentage >= 70) return "B";
        else if (percentage >= 60) return "C";
        else return "D";
    },

            showResult: function(){
                console.log("Studen Name: ", this.sname)
                console.log("Studen Roll: ", this.rollno)
                console.log("Studen Course: ", this.course)
                console.log("Studen Subject: ", this.s1)
                console.log("Studen Subject: ", this.s2)
                console.log("Studen Subject: ", this.s3)
                console.log("Studen Marks in ",this.s1, " are : ", this.sub1)
                console.log("Studen Marks in ",this.s2, " are : ", this.sub2)
                console.log("Studen Marks in ",this.s3, " are : ", this.sub3)
                console.log("The Total of three Subjects is: ", this.showTotal())
                console.log("The Percentages are: ", this.showPercentage())
                console.log("The grades of the Student is: ", this.showGrades())
            }

        } 

        studentName.showResult()
