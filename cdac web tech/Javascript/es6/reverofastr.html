<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse of a String</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background: #222;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button,
        nav a {
            padding: 9px 14px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        nav button:hover,
        nav a:hover {
            background: #555;
        }

        /* Main Container */
        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);

            margin: 60px auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 16px;
            outline: none;
            margin-bottom: 12px;
        }

        input:focus {
            border-color: #333;
        }

        .reverse-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .reverse-btn:hover {
            background: #444;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 7px;
            line-height: 1.8;
            font-family: monospace;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>

        <button onclick="history.forward()">Forward</button>

        <button onclick="history.back()">Backward</button>

        <a href="/make_clock.html">Clock</a>

        <a href="/stopwatch.html">Stop Watch</a>

        <a href="/otpgenerator.html">OTP Generator</a>

        <a href="/reverofastr.html">Reverse of String</a>

    </nav>


    <!-- Main Content -->
    <div class="container">

        <h1>Reverse a String</h1>

        <p>
            Enter a string to see the reverse step by step.
        </p>

        <input type="text" id="stringInput" placeholder="Enter a string...">

        <button class="reverse-btn" onclick="reverseString()">
            Reverse
        </button>

        <div id="output">
            Output will appear here...
        </div>

    </div>


    <script>
        function reverseString() {

            let str = document.getElementById("stringInput").value;
            let output = document.getElementById("output");

            if (str === "") {
                output.textContent = "Please enter a string.";
                return;
            }

            let result =  "\n";

            for (let i = str.length; i>0; i--) {
               const roated= str.substring(i)+str.substring(0,i)

                result += roated+ "\n";
            }

            output.textContent = result;
        }
    </script>

</body>

</html>
