<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Clock</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        color: white;
        overflow: hidden;
        min-height: 100vh;
    }

    /* =========================
       NAVIGATION
    ========================= */

    nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;

        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;

        padding: 15px 20px;

        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        border-bottom: 1px solid rgba(255, 255, 255, 0.15);

        z-index: 10;
    }

    nav button,
    nav a {
        padding: 8px 14px;

        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;

        background: rgba(255, 255, 255, 0.08);

        color: white;

        font-size: 14px;
        text-decoration: none;

        cursor: pointer;

        transition: all 0.25s ease;
    }

    nav button:hover,
    nav a:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.5);

        transform: translateY(-1px);
    }

    /* =========================
       BACKGROUND VIDEO
    ========================= */

    .video-background {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        z-index: -2;
    }

    /* Dark overlay */
    .video-overlay {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        background: rgba(5, 15, 25, 0.4);

        z-index: -1;
    }

    /* =========================
       CLOCK CONTAINER
    ========================= */

    .clock-container {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 80px 20px 20px;
    }

    /* =========================
       CLOCK
    ========================= */

    .clock {
        width: 360px;
        height: 360px;

        border: 2px solid rgba(255, 255, 255, 0.55);

        border-radius: 50%;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        background: rgba(255, 255, 255, 0.03);

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        box-shadow:
            0 0 40px rgba(255, 255, 255, 0.08),
            inset 0 0 40px rgba(255, 255, 255, 0.05);

        animation: breathe 6s ease-in-out infinite;
    }

    /* =========================
       TIME
    ========================= */

    #disp {
        font-size: 3.2rem;

        font-weight: 400;

        letter-spacing: 4px;

        text-shadow:
            0 0 15px rgba(255, 255, 255, 0.25);
    }

    /* =========================
       AM / PM
    ========================= */

    #ampm {
        margin-top: 18px;

        font-size: 1rem;

        font-weight: 300;

        letter-spacing: 8px;

        opacity: 0.8;
    }

    /* =========================
       DATE
    ========================= */

    #date {
        margin-top: 20px;

        font-size: 0.9rem;

        font-weight: 300;

        letter-spacing: 2px;

        opacity: 0.6;
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes breathe {
        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.015);
        }

        100% {
            transform: scale(1);
        }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        nav {
            gap: 6px;
            padding: 10px;
        }

        nav button,
        nav a {
            padding: 7px 9px;
            font-size: 12px;
        }

        .clock {
            width: 290px;
            height: 290px;
        }

        #disp {
            font-size: 2.2rem;
            letter-spacing: 3px;
        }

        #ampm {
            margin-top: 14px;
            font-size: 0.85rem;
            letter-spacing: 6px;
        }

        #date {
            margin-top: 15px;
            font-size: 0.75rem;
        }
    }
</style>


</head>

<body>


<!-- Navigation -->
<nav>

    <button onclick="history.forward()">Forward</button>

    <button onclick="history.back()">Backward</button>

    <a href="/make_clock.html">Clock</a>

    <a href="/stopwatch.html">Stop Watch</a>

    <a href="/otpgenerator.html">OTP Generator</a>

    <a href="/reverofastr.html">Reverse of String</a>

</nav>


<!-- Background Video -->
<video autoplay muted loop playsinline class="video-background">
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>


<!-- Clock -->
<main class="clock-container">

    <div class="clock">

        <div id="disp">
            00:00:00
        </div>

        <div id="ampm">
            AM
        </div>

        <div id="date">
            Loading...
        </div>

    </div>

</main>


<script>

    let clock_disp = document.getElementById("disp");
    let ampm_disp = document.getElementById("ampm");
    let date_disp = document.getElementById("date");


    function showTime() {

        let now = new Date();

        // Get current time
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();


        // AM / PM
        let ampm;

        if (hours >= 12) {
            ampm = "PM";
        } else {
            ampm = "AM";
        }


        // Convert 24-hour format to 12-hour format
        hours = hours % 12;

        if (hours === 0) {
            hours = 12;
        }


        // Add leading zero
        hours = String(hours).padStart(2, "0");
        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");


        // Display time
        clock_disp.innerHTML =
            hours + ":" + minutes + ":" + seconds;


        // Display AM / PM
        ampm_disp.innerHTML = ampm;


        // Display date
        let day = String(now.getDate()).padStart(2, "0");
        let month = String(now.getMonth() + 1).padStart(2, "0");
        let year = now.getFullYear();

        date_disp.innerHTML =
            day + "/" + month + "/" + year;
    }


    // Run immediately
    showTime();


    // Update every second
    setInterval(showTime, 1000);

</script>


</body>

</html>
