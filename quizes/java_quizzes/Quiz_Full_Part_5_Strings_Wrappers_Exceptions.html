<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Bank Part 5: Strings, Wrappers & Exception Handling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 32px;
        }

        .quiz-container {
            background: white;
            border-radius: 16px;
            box-shadow: none;
            max-width: 520px;
            width: 100%;
            padding: 18px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 640px;
        }

        .quiz-header {
            text-align: left;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: 600;
            color: #232323;
            margin-bottom: 4px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #9d9d9d;
        }

        .progress-text {
            text-align: left;
            font-size: 13px;
            color: #9d9d9d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2a2a2a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options::-webkit-scrollbar {
            width: 6px;
        }

        .options::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
        }

        .option:hover:not(.selected):not(.disabled) {
            border-color: #e6e6e6;
            background: #f6f6f6;
        }

        .option.selected {
            border-color: #d0d0d0;
            background: #dedede;
        }

        .option.correct,
        .option.wrong {
            border-color: #f0f0f0;
            background: #f8f8f8;
        }

        .option.disabled {
            cursor: default;
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            margin-right: 10px;
            flex-shrink: 0;
            color: #9d9d9d;
            width: 22px;
        }

        .option.selected .option-label {
            color: #3a3a3a;
        }

        .option.disabled .option-text {
            color: #bdbdbd;
        }

        .option.disabled .option-label {
            color: #bdbdbd;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3a;
        }


        .feedback-card {
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-card.correct {
            background: #bfeacb;
        }

        .feedback-card.wrong {
            background: #fff7f7;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-header.correct {
            color: #697b6e;
        }

        .feedback-header.wrong {
            color: #a42d22;
        }

        .feedback-icon {
            font-size: 16px;
            font-weight: 600;
        }

        .feedback-answer {
            font-size: 15px;
            color: #2a2a2a;
        }

        .feedback-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback-card.correct .feedback-text {
            color: #444443;
        }

        .feedback-card.wrong .feedback-text {
            color: #2e2e2f;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 52px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .btn-secondary {
            background: #ffffff;
            color: #6b7280;
            border: 1px solid #e2e2e2;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e5e5;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #424cf7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(66, 76, 247, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        .completion-container {
            text-align: center;
            display: none;
        }

        .completion-container.show {
            display: block;
        }

        .completion-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .stat-card.score {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card.score .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.score .stat-value {
            color: white;
        }

        .completion-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4e4e4e;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .hint-toggle .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .hint-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .hint-panel {
            padding: 12px 14px;
            background: #ebecf8;
            border-radius: 12px;
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hint-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hint-title {
            font-weight: 600;
            font-size: 13px;
            color: #4e4e4e;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 13px;
            color: #474749;
            line-height: 1.5;
        }

        .hint-slot {
            min-height: 72px;
        }

        .quiz-footer {
            margin-top: auto;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }
    </style>

    <script>
        const questions = [{"num": 141, "question": "Q141. MCQ (Coding): Which of the following statements correctly demonstrates an unchecked exception in Java? ```java // Option 1 int result = 10 / 0; // Option 2 String str = null; int length = str.length(); // Option 3 int[] arr = { 1, 2, 3 }; int value = arr[5]; ```", "options": ["Option 1", "Option 2", "Option 3", "Both Option 1 and Option 3"], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Division by zero for integers throws ArithmeticException; dereferencing null throws NullPointerException; accessing an invalid array index throws ArrayIndexOutOfBoundsException. All are unchecked exceptions.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Division by zero for integers throws ArithmeticException; dereferencing null throws NullPointerException; accessing an invalid array index throws ArrayIndexOutOfBoundsException. All are unchecked exceptions.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 142, "question": "Q142. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Hello, World!\"; boolean startsWithHello = str.startsWith(\"Hello\"); boolean startsWithHi = str.startsWith(\"Hi\"); System.out.println(startsWithHello); System.out.println(startsWithHi); ```", "options": ["true, false", "false, true", "true, true", "false, false"], "correctIndex": 0, "hint": "", "correctExplanation": "startsWith checks whether the string begins with the supplied prefix; Hello matches, Hi does not.", "wrongExplanation": "startsWith checks whether the string begins with the supplied prefix; Hello matches, Hi does not."}, {"num": 143, "question": "Q143. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Hello, World!\"; boolean endsWithWorld = str.endsWith(\"World!\"); boolean endsWithJava = str.endsWith(\"Java\"); System.out.println(endsWithWorld); System.out.println(endsWithJava); ```", "options": ["true, false", "false, true", "true, true", "false, false"], "correctIndex": 0, "hint": "", "correctExplanation": "endsWith checks the suffix; the text ends in World!, not Java.", "wrongExplanation": "endsWith checks the suffix; the text ends in World!, not Java."}, {"num": 144, "question": "Q144. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Hello, World!\"; boolean containsHello = str.contains(\"Hello\"); boolean containsHi = str.contains(\"Hi\"); System.out.println(containsHello); System.out.println(containsHi); ```", "options": ["true, false", "false, true", "true, true", "false, false"], "correctIndex": 0, "hint": "", "correctExplanation": "contains checks for a substring; Hello is present and Hi is not.", "wrongExplanation": "contains checks for a substring; Hello is present and Hi is not."}, {"num": 145, "question": "Q145. MCQ (Coding): What is the output of the following Java code snippet? ```java String str1 = \"Java\"; String str2 = \"Java\"; String str3 = new String(\"Java\"); System.out .println(str1 == str2); System.out.println(str1 == str3); ```", "options": ["true, true", "true, false", "false, true", "false, false"], "correctIndex": 1, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "String literals with the same contents refer to the pooled literal. new String(\"Java\") creates a distinct String object, so == is false for that comparison.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "String literals with the same contents refer to the pooled literal. new String(\"Java\") creates a distinct String object, so == is false for that comparison.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 146, "question": "Q146. MCQ (Coding): What is the output of the following Java code snippet? ```java String str1 = new String(\"Hello\").intern(); String str2 = new String(\"Hello\").intern(); System.out.println(str1 == str2); ```", "options": ["true", "false", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "", "correctExplanation": "intern() returns the canonical pooled String for that content, so both references are identical.", "wrongExplanation": "intern() returns the canonical pooled String for that content, so both references are identical."}, {"num": 147, "question": "Q147. MCQ (Coding): What is the output of the following Java code snippet? ```java StringBuffer sb = new StringBuffer(\"Hello\"); sb.append(\" World\"); System.out.println(sb); ```", "options": ["\"Hello World\"", "\"World Hello\"", "\"Hello\"", "Compilation error"], "correctIndex": 0, "hint": "", "correctExplanation": "StringBuffer.append mutates the buffer by adding the supplied text at the end.", "wrongExplanation": "StringBuffer.append mutates the buffer by adding the supplied text at the end."}, {"num": 148, "question": "Q148. MCQ (Coding): Which of the following statements correctly demonstrates appending a string in `StringBuffer` and `StringBuilder`? ```java // Option 1 StringBuffer sb = new StringBuffer(); sb.append(\"Hello\"); // Option 2 StringBuilder sb = new StringBuilder(); sb.append(\"Hello\"); // Option 3 StringBuffer sb = new StringBuffer(\"Hello\"); ```", "options": ["Option 1", "Option 2", "Option 3", "Both Option 1 and Option 2"], "correctIndex": 0, "hint": "", "correctExplanation": "Both StringBuffer and StringBuilder support append(String).", "wrongExplanation": "Both StringBuffer and StringBuilder support append(String)."}, {"num": 149, "question": "Q149. Which of the following methods is used to extract the length of a string in Java?", "options": ["length()", "len()", "sizeof()", "size()"], "correctIndex": 0, "hint": "", "correctExplanation": "String.length() returns the number of UTF-16 code units in the string.", "wrongExplanation": "String.length() returns the number of UTF-16 code units in the string."}, {"num": 150, "question": "Q150. MCQ: Which of the following statements about the string pool is true?", "options": ["Strings created using the `new` keyword are stored in the string pool.", "Strings created using the `new` keyword are not stored in the string pool.", "The string pool is a separate memory area reserved for long strings.", "The string pool is a part of the heap memory."], "correctIndex": 1, "hint": "", "correctExplanation": "The string pool is part of heap storage; new String creates a distinct object, although its literal argument may itself be pooled.", "wrongExplanation": "The string pool is part of heap storage; new String creates a distinct object, although its literal argument may itself be pooled."}, {"num": 151, "question": "Q151. What happens when the same String literal is used multiple times?", "options": ["A new object is always created", "The same String Pool object can be reused", "Compilation fails", "The previous String is deleted"], "correctIndex": 1, "hint": "", "correctExplanation": "Repeated identical string literals can refer to the same pooled String object.", "wrongExplanation": "Repeated identical string literals can refer to the same pooled String object."}, {"num": 152, "question": "Q152. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Java Programming\"; String upperCaseStr = str.toUpperCase(); System.out.println(upperCaseStr); ```", "options": ["\"java programming\"", "\"JAVA PROGRAMMING\"", "\"Java Programming\"", "\"Java programming\""], "correctIndex": 1, "hint": "", "correctExplanation": "toUpperCase returns a new string with letters converted to uppercase.", "wrongExplanation": "toUpperCase returns a new string with letters converted to uppercase."}, {"num": 153, "question": "Q153. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Hello, World!\"; String replacedStr = str.replace(\"l\", \"X\"); System.out.println(replacedStr); ```", "options": ["\"HexXo, WorXd!\"", "\"Hello, World!\"", "\"HeXXo, WorXd!\"", "\"HeXXo, WorXd!X\""], "correctIndex": 2, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "String.replace(\"l\", \"X\") replaces every lowercase l. In 'Hello, World!' there are three lowercase l characters, producing HeXXo, WorXd!.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "String.replace(\"l\", \"X\") replaces every lowercase l. In 'Hello, World!' there are three lowercase l characters, producing HeXXo, WorXd!.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 154, "question": "Q154. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \"Hello, World!\"; String lowerCaseStr = str.toLowerCase(); System.out.println(lowerCaseStr); ```", "options": ["\"HELLO, WORLD!\"", "\"hello, world!\"", "\"Hello, World!\"", "\"hello, world!\""], "correctIndex": 1, "hint": "", "correctExplanation": "toLowerCase returns a new string with letters converted to lowercase.", "wrongExplanation": "toLowerCase returns a new string with letters converted to lowercase."}, {"num": 155, "question": "Q155. MCQ (Coding): What is the output of the following Java code snippet? ```java String str = \" Hello, World! \"; String trimmedStr = str.trim(); System.out.println(trimmedStr); ```", "options": ["\"Hello, World!\"", "\"Hello, World! \"", "\" Hello, World!\"", "\" Hello, World! \""], "correctIndex": 0, "hint": "", "correctExplanation": "trim removes leading and trailing characters whose code points are <= U+0020; it does not remove internal spaces.", "wrongExplanation": "trim removes leading and trailing characters whose code points are <= U+0020; it does not remove internal spaces."}, {"num": 156, "question": "Q156. MCQ (Coding): What is the output of the following Java code snippet? ```java boolean flag = true; String str = Boolean.toString(flag); System.out.println(str); ```", "options": ["true", "\"true\"", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Boolean.toString(true) returns the String containing the characters true. println prints those characters without quotation marks; quotation marks in an option are explanatory notation, not output.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Boolean.toString(true) returns the String containing the characters true. println prints those characters without quotation marks; quotation marks in an option are explanatory notation, not output.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 157, "question": "Q157. MCQ (Coding): What is the output of the following Java code snippet? ```java int num = Integer.parseInt(\"42\"); System.out.println(num); ```", "options": ["42", "\"42\"", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "", "correctExplanation": "Integer.parseInt converts the numeric text '42' to primitive int 42.", "wrongExplanation": "Integer.parseInt converts the numeric text '42' to primitive int 42."}, {"num": 158, "question": "Q158. MCQ: How can you explicitly add a string to the string pool in Java?", "options": ["By calling the `addToPool()` method provided by the `String` class.", "By calling the `intern()` method on the string object.", const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
