<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 2 - Classes, Objects, Constructors, Static</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 32px;
        }

        .quiz-container {
            background: white;
            border-radius: 16px;
            box-shadow: none;
            max-width: 520px;
            width: 100%;
            padding: 18px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 640px;
        }

        .quiz-header {
            text-align: left;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: 600;
            color: #232323;
            margin-bottom: 4px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #9d9d9d;
        }

        .progress-text {
            text-align: left;
            font-size: 13px;
            color: #9d9d9d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2a2a2a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options::-webkit-scrollbar {
            width: 6px;
        }

        .options::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
        }

        .option:hover:not(.selected):not(.disabled) {
            border-color: #e6e6e6;
            background: #f6f6f6;
        }

        .option.selected {
            border-color: #d0d0d0;
            background: #dedede;
        }

        .option.correct,
        .option.wrong {
            border-color: #f0f0f0;
            background: #f8f8f8;
        }

        .option.disabled {
            cursor: default;
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            margin-right: 10px;
            flex-shrink: 0;
            color: #9d9d9d;
            width: 22px;
        }

        .option.selected .option-label {
            color: #3a3a3a;
        }

        .option.disabled .option-text {
            color: #bdbdbd;
        }

        .option.disabled .option-label {
            color: #bdbdbd;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3a;
        }


        .feedback-card {
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-card.correct {
            background: #bfeacb;
        }

        .feedback-card.wrong {
            background: #fff7f7;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-header.correct {
            color: #697b6e;
        }

        .feedback-header.wrong {
            color: #a42d22;
        }

        .feedback-icon {
            font-size: 16px;
            font-weight: 600;
        }

        .feedback-answer {
            font-size: 15px;
            color: #2a2a2a;
        }

        .feedback-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback-card.correct .feedback-text {
            color: #444443;
        }

        .feedback-card.wrong .feedback-text {
            color: #2e2e2f;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 52px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .btn-secondary {
            background: #ffffff;
            color: #6b7280;
            border: 1px solid #e2e2e2;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e5e5;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #424cf7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(66, 76, 247, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        .completion-container {
            text-align: center;
            display: none;
        }

        .completion-container.show {
            display: block;
        }

        .completion-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .stat-card.score {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card.score .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.score .stat-value {
            color: white;
        }

        .completion-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4e4e4e;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .hint-toggle .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .hint-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .hint-panel {
            padding: 12px 14px;
            background: #ebecf8;
            border-radius: 12px;
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hint-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hint-title {
            font-weight: 600;
            font-size: 13px;
            color: #4e4e4e;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 13px;
            color: #474749;
            line-height: 1.5;
        }

        .hint-slot {
            min-height: 72px;
        }

        .quiz-footer {
            margin-top: auto;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }
    </style>

</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <div class="quiz-title">Quiz 2 - Classes, Objects, Constructors, Static</div>
            <div class="quiz-subtitle">Based on 1 source</div>
        </div>

        <div id="quiz-content">
            <!-- Questions will be rendered here -->
        </div>

        <div id="completion-screen" class="completion-container">
            <div class="completion-icon">🎉</div>
            <div class="completion-title">You did it! Quiz Complete.</div>
            <div class="completion-subtitle">Here's how you performed</div>

            <div class="stats-grid">
                <div class="stat-card score">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score-value">0/15</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracy-value">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Right</div>
                    <div class="stat-value" id="right-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Wrong</div>
                    <div class="stat-value" id="wrong-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Skipped</div>
                    <div class="stat-value" id="skipped-value">0</div>
                </div>
            </div>

            <div class="completion-buttons">
                <button class="btn btn-secondary" onclick="reviewQuiz()">Review Quiz</button>
                <button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/contrib/auto-render.min.js"></script>
    <script>
        const questions = [{"question": "What is printed?\n\nclass Counter { static int c; int id; Counter() { id = ++c; } }\nCounter a = new Counter(), b = new Counter(), d = new Counter();\nSystem.out.println(Counter.c + \" \" + b.id);", "options": ["1 2", "2 2", "3 2", "3 3"], "correctIndex": 2, "hint": "", "correctExplanation": "count is STATIC, so there is one shared copy: after three objects it is 3. Each object's id is assigned from the shared counter at creation: a=1, b=2, d=3. So b.id = 2.", "wrongExplanation": "count is STATIC, so there is one shared copy: after three objects it is 3. Each object's id is assigned from the shared counter at creation: a=1, b=2, d=3. So b.id = 2."}, {"question": "What is printed?\n\nclass P {\n  P() { this(5); System.out.println(\"A\"); }\n  P(int x) { System.out.println(\"B\" + x); }\n}\nnew P();", "options": ["Compile error", "B5 then A", "B5 only", "A then B5"], "correctIndex": 1, "hint": "", "correctExplanation": "new P() calls P(), whose first statement this(5) jumps to P(int) which prints B5. When that finishes, control returns to P() and prints A. Constructor chaining with this() runs the target constructor first.", "wrongExplanation": "new P() calls P(), whose first statement this(5) jumps to P(int) which prints B5. When that finishes, control returns to P() and prints A. Constructor chaining with this() runs the target constructor first."}, {"question": "What is printed?\n\nclass A { A() { System.out.println(\"A\"); } }\nclass B extends A { B() { System.out.println(\"B\"); } }\nnew B();", "options": ["B", "A then B", "A", "B then A"], "correctIndex": 1, "hint": "", "correctExplanation": "B's constructor has an invisible super() as its first line, so A's constructor runs FIRST (prints A), then B's body (prints B). Parent is always built before child.", "wrongExplanation": "B's constructor has an invisible super() as its first line, so A's constructor runs FIRST (prints A), then B's body (prints B). Parent is always built before child."}, {"question": "What is printed for two objects?\n\nclass X {\n  static { System.out.println(\"static\"); }\n  { System.out.println(\"init\"); }\n  X() { System.out.println(\"ctor\"); }\n}\nnew X();\nnew X();", "options": ["init ctor static init ctor", "static static init ctor init ctor", "static init ctor init ctor", "static init ctor (only once)"], "correctIndex": 2, "hint": "", "correctExplanation": "The static block runs ONCE when the class is first loaded. The instance block runs before the constructor body for EVERY object. Order: static, init, ctor, init, ctor.", "wrongExplanation": "The static block runs ONCE when the class is first loaded. The instance block runs before the constructor body for EVERY object. Order: static, init, ctor, init, ctor."}, {"question": "What is printed?\n\nstatic void inc(int n) { n++; }\nstatic void set(int[] x) { x[0] = 99; }\nint a = 5; int[] arr = {1};\ninc(a); set(arr);\nSystem.out.println(a + \" \" + arr[0]);", "options": ["5 99", "6 1", "5 1", "6 99"], "correctIndex": 0, "hint": "", "correctExplanation": "Java is ALWAYS pass-by-value. int: a copy is incremented, original stays 5. Array: the REFERENCE is copied, but both copies point to the same array, so arr[0] = 99 is visible outside.", "wrongExplanation": "Java is ALWAYS pass-by-value. int: a copy is incremented, original stays 5. Array: the REFERENCE is copied, but both copies point to the same array, so arr[0] = 99 is visible outside."}, {"question": "What is printed?\n\nclass Person { String name; Person(String n) { name = n; } }\nPerson p1 = new Person(\"John\");\nPerson p2 = p1;\np1.name = \"Alice\";\np1 = new Person(\"New\");\nSystem.out.println(p2.name + \" \" + p1.name);", "options": ["Alice New", "Alice Alice", "John New", "New New"], "correctIndex": 0, "hint": "", "correctExplanation": "p2 copies p1's reference, so changing p1.name to Alice shows through p2. Then p1 = new Person(\"New\") only re-points p1; p2 still points at the old object, whose name is Alice. (Bank Q7 / Q75 / Q233 theme.)", "wrongExplanation": "p2 copies p1's reference, so changing p1.name to Alice shows through p2. Then p1 = new Person(\"New\") only re-points p1; p2 still points at the old object, whose name is Alice. (Bank Q7 / Q75 / Q233 theme.)"}, {"question": "Main is in the DEFAULT package and is NOT a subclass. It has: MyClass obj = new MyClass(); obj.display(); where MyClass (package Package1) declares 'protected void display()'. Result? (Bank Q36/Q42 theme)", "options": ["Prints nothing", "Runtime IllegalAccessException", "Prints the message", "Compile error - display() is not accessible"], "correctIndex": 3, "hint": "", "correctExplanation": "protected = same package OR subclass (through inheritance). Main is in another package and is not a subclass, so the compiler rejects the call. The bank's Q36 key says the code compiles - that is wrong for the same reason (Main is not in Package2 and does not extend Parent).", "wrongExplanation": "protected = same package OR subclass (through inheritance). Main is in another package and is not a subclass, so the compiler rejects the call. The bank's Q36 key says the code compiles - that is wrong for the same reason (Main is not in Package2 and does not extend Parent)."}, {"question": "What happens?\n\nint v = 5;\nSystem.out.println(v);", "options": ["NullPointerException", "Compile error", "Prints 0", "Prints 5"], "correctIndex": 1, "hint": "", "correctExplanation": "A static method has no 'this', so it cannot use an instance field directly. You need an object: new Main().v. (Static can't see instance; instance CAN see static.)", "wrongExplanation": "A static method has no 'this', so it cannot use an instance field directly. You need an object: new Main().v. (Static can't see instance; instance CAN see static.)"}, {"question": "What is printed? (no exception!)\n\nclass S { static void hi() { System.out.println(\"hi\"); } }\nS s = null;\ns.hi();", "options": ["Nothing", "NullPointerException", "hi", "Compile error"], "correctIndex": 2, "hint": "", "correctExplanation": "A static method belongs to the CLASS. The compiler turns s.hi() into S.hi() using the declared type, so the null reference is never touched. Instance methods on null would throw NPE; static ones don't.", "wrongExplanation": "A static method belongs to the CLASS. The compiler turns s.hi() into S.hi() using the declared type, so the null reference is never touched. Instance methods on null would throw NPE; static ones don't."}, {"question": "What is printed?\n\nclass Person { String name; Person(String n) { name = n; } }\nPerson p1 = new Person(\"A\");\nPerson p2 = new Person(\"A\");\nSystem.out.println((p1 == p2) + \" \" + p1.equals(p2));", "options": ["false false", "false true", "true true", "true false"], "correctIndex": 0, "hint": "", "correctExplanation": "== compares references (two different objects -> false). equals() is NOT overridden here, so Object.equals falls back to == (false). To get content equality you must override equals() and hashCode().", "wrongExplanation": "== compares references (two different objects -> false). equals() is NOT overridden here, so Object.equals falls back to == (false). To get content equality you must override equals() and hashCode()."}, {"question": "What happens at new X()?\n\nclass X { X(int a) { } }\nnew X();", "options": ["Works - default constructor is provided", "Runtime exception", "Prints null", "Compile error - no no-arg constructor exists"], "correctIndex": 3, "hint": "", "correctExplanation": "The compiler adds a default no-arg constructor ONLY when you write NO constructor at all. As soon as you declare X(int), the free one disappears and new X() fails to compile.", "wrongExplanation": "The compiler adds a default no-arg constructor ONLY when you write NO constructor at all. As soon as you declare X(int), the free one disappears and new X() fails to compile."}, {"question": "When does a static initializer block run?", "options": ["Every time an object is created", "When garbage collection runs", "When main() ends", "When the class is first loaded/initialized (once)"], "correctIndex": 3, "hint": "", "correctExplanation": "Static blocks run once, when the JVM initializes the class (first object creation, first static access, etc.). Instance init blocks are the ones that run per object.", "wrongExplanation": "Static blocks run once, when the JVM initializes the class (first object creation, first static access, etc.). Instance init blocks are the ones that run per object."}, {"question": "After o.set(9), what is o.a?\n\nclass A {\n  int a = 4;\n  void set(int a) { a = a; }\n}\nA o = new A();\no.set(9);\nSystem.out.println(o.a);", "options": ["9", "0", "4", "Compile error"], "correctIndex": 2, "hint": "", "correctExplanation": "Inside set, the parameter 'a' SHADOWS the field. a = a assigns the parameter to itself, so the field stays 4. Fix: this.a = a. This is exactly why constructors/setters use this.", "wrongExplanation": "Inside set, the parameter 'a' SHADOWS the field. a = a assigns the parameter to itself, so the field stays 4. Fix: this.a = a. This is exactly why constructors/setters use this."}, {"question": "A class has a PRIVATE constructor. From where can new be called on it?", "options": ["Only inside the same class (e.g. a static factory/singleton method)", "Anywhere", "Only in subclasses", "Only in the same package"], "correctIndex": 0, "hint": "", "correctExplanation": "private means visible only inside the declaring class. That is the basis of the Singleton pattern: the class creates its single instance itself and exposes it via a public static method.", "wrongExplanation": "private means visible only inside the declaring class. That is the basis of the Singleton pattern: the class creates its single instance itself and exposes it via a public static method."}, {"question": "Object o1 = new Object(); Object o2 = new Object(); o1 = o2; o2 = null;  -- How many objects are now eligible for GC? (Bank Q57)", "options": ["2", "1", "Cannot be determined", "0"], "correctIndex": 1, "hint": "", "correctExplanation": "The FIRST object lost its only reference when o1 was re-pointed, so it is eligible. The second object is still referenced by o1 (o2 = null only removes one of its two references). Answer: exactly 1. (Bank Q35 key says Option 2 makes an object eligible - wrong: obj2 still references it.)", "wrongExplanation": "The FIRST object lost its only reference when o1 was re-pointed, so it is eligible. The second object is still referenced by o1 (o2 = null only removes one of its two references). Answer: exactly 1. (Bank Q35 key says Option 2 makes an object eligible - wrong: obj2 still references it.)"}];
        const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
</body>
</html>
