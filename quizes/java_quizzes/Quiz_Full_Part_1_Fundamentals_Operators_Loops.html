<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Bank Part 1: Java Fundamentals, Data Types & Operators</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 32px;
        }

        .quiz-container {
            background: white;
            border-radius: 16px;
            box-shadow: none;
            max-width: 520px;
            width: 100%;
            padding: 18px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 640px;
        }

        .quiz-header {
            text-align: left;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: 600;
            color: #232323;
            margin-bottom: 4px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #9d9d9d;
        }

        .progress-text {
            text-align: left;
            font-size: 13px;
            color: #9d9d9d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2a2a2a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options::-webkit-scrollbar {
            width: 6px;
        }

        .options::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
        }

        .option:hover:not(.selected):not(.disabled) {
            border-color: #e6e6e6;
            background: #f6f6f6;
        }

        .option.selected {
            border-color: #d0d0d0;
            background: #dedede;
        }

        .option.correct,
        .option.wrong {
            border-color: #f0f0f0;
            background: #f8f8f8;
        }

        .option.disabled {
            cursor: default;
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            margin-right: 10px;
            flex-shrink: 0;
            color: #9d9d9d;
            width: 22px;
        }

        .option.selected .option-label {
            color: #3a3a3a;
        }

        .option.disabled .option-text {
            color: #bdbdbd;
        }

        .option.disabled .option-label {
            color: #bdbdbd;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3a;
        }


        .feedback-card {
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-card.correct {
            background: #bfeacb;
        }

        .feedback-card.wrong {
            background: #fff7f7;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-header.correct {
            color: #697b6e;
        }

        .feedback-header.wrong {
            color: #a42d22;
        }

        .feedback-icon {
            font-size: 16px;
            font-weight: 600;
        }

        .feedback-answer {
            font-size: 15px;
            color: #2a2a2a;
        }

        .feedback-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback-card.correct .feedback-text {
            color: #444443;
        }

        .feedback-card.wrong .feedback-text {
            color: #2e2e2f;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 52px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .btn-secondary {
            background: #ffffff;
            color: #6b7280;
            border: 1px solid #e2e2e2;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e5e5;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #424cf7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(66, 76, 247, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        .completion-container {
            text-align: center;
            display: none;
        }

        .completion-container.show {
            display: block;
        }

        .completion-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .stat-card.score {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card.score .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.score .stat-value {
            color: white;
        }

        .completion-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4e4e4e;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .hint-toggle .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .hint-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .hint-panel {
            padding: 12px 14px;
            background: #ebecf8;
            border-radius: 12px;
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hint-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hint-title {
            font-weight: 600;
            font-size: 13px;
            color: #4e4e4e;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 13px;
            color: #474749;
            line-height: 1.5;
        }

        .hint-slot {
            min-height: 72px;
        }

        .quiz-footer {
            margin-top: auto;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }
    </style>

    <script>
        const questions = [{"num": 1, "question": "Q1. MCQ (Coding): Which of the following code snippets demonstrates a shallow copy of an array? ```java // Option 1 int[] sourceArray = {1, 2, 3, 4, 5}; int[] shallowCopy = sourceArray; // Option 2 int[] sourceArray = {1, 2, 3, 4, 5}; int[] shallowCopy = new int[sourceArray.length]; System.arraycopy(sourceArray, 0, shallowCopy, 0, sourceArray.length); // Option 3 int[] sourceArray = {1, 2, 3, 4, 5}; int[] shallowCopy = Arrays.copyOf(sourceArray, sourceArray.length); ```", "options": ["Option 1", "Option 2", "Option 3", "Both Option 1 and Option 2"], "correctIndex": 1, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "The question confuses reference assignment with copying. Option 1 makes both variables refer to the same array; Options 2 and 3 create separate arrays. Because this is an int[] of primitives, the copied elements are independent; shallow-vs-deep copying is not meaningfully different here.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "The question confuses reference assignment with copying. Option 1 makes both variables refer to the same array; Options 2 and 3 create separate arrays. Because this is an int[] of primitives, the copied elements are independent; shallow-vs-deep copying is not meaningfully different here.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 2, "question": "Q2. MCQ (Coding): Which of the following code snippets demonstrates a deep copy of an array? ```java // Option 1 int[] sourceArray = {1, 2, 3, 4, 5}; int[] deepCopy = sourceArray.clone(); // Option 2 int[] sourceArray = {1, 2, 3, 4, 5}; int[] deepCopy = Arrays.copyOf(sourceArray, sourceArray.length); // Option 3 int[] sourceArray = {1, 2, 3, 4, 5}; int[] deepCopy = new int[sourceArray.length]; System.arraycopy(sourceArray, 0, deepCopy, 0, sourceArray.length); ```", "options": ["Option 1", "Option 2", "Option 3", "All options create shallow copies, not deep copies."], "correctIndex": 3, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "All three operations copy the int[] elements into a new array. Since the elements are primitive ints, the result is independent; for arrays of objects, clone/copyOf/arraycopy copy references and are shallow copies, not deep copies.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "All three operations copy the int[] elements into a new array. Since the elements are primitive ints, the result is independent; for arrays of objects, clone/copyOf/arraycopy copy references and are shallow copies, not deep copies.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 3, "question": "Q3. What will be the output of the following code snippet? ```java int day = 2; switch (day) { case 1: System.out.println(\"Monday\"); break; case 2: System.out.println(\"Tuesday\"); break; case 3: System.out.println(\"Wednesday\"); break; default: System.out.println(\"Invalid day\"); break; } ```", "options": ["Monday", "Tuesday", "Wednesday", "Invalid day"], "correctIndex": 1, "hint": "", "correctExplanation": "day is 2, so the case 2 branch runs and prints Tuesday; break exits the switch.", "wrongExplanation": "day is 2, so the case 2 branch runs and prints Tuesday; break exits the switch."}, {"num": 4, "question": "Q4. What will be the output of the following code snippet? ```java int age = 25; if (age < 18) { System.out.println(\"You are a minor.\"); } else if (age >= 18 && age < 60) { System.out.println(\"You are an adult.\"); } else { System.out.println(\"You are a senior citizen.\"); } ```", "options": ["You are a minor.", "You are an adult.", "You are a senior citizen.", "The code will not compile"], "correctIndex": 1, "hint": "", "correctExplanation": "25 satisfies age >= 18 && age < 60, so the adult branch runs.", "wrongExplanation": "25 satisfies age >= 18 && age < 60, so the adult branch runs."}, {"num": 5, "question": "Q5. What will be the output of the following code snippet? ```java int x = 10; if (x > 5) { System.out.println(\"x is greater than 5\"); } else if (x > 0) { System.out.println(\"x is positive\"); } else { System.out.println(\"x is negative\"); } ```", "options": ["x is greater than 5", "x is positive", "x is negative", "The code will not compile"], "correctIndex": 0, "hint": "", "correctExplanation": "The first condition x > 5 is true, so later else-if branches are skipped.", "wrongExplanation": "The first condition x > 5 is true, so later else-if branches are skipped."}, {"num": 6, "question": "Q6. MCQ (Coding): What is the output of the following Java code snippet? ```java Integer num1 = 100; Integer num2 = 100; System.out.println(num1 == num2); Integer num3 = 200; Integer num4 = 200; System.out.println(num3 == num4); ```", "options": ["true, true", "true, false", "false, true", "false, false"], "correctIndex": 1, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Integer values from -128 through 127 are guaranteed to be cached, so the first comparison is true. Caching 200 is not guaranteed by the Java language specification, so the second comparison is implementation-dependent. The question has no universally guaranteed complete output.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Integer values from -128 through 127 are guaranteed to be cached, so the first comparison is true. Caching 200 is not guaranteed by the Java language specification, so the second comparison is implementation-dependent. The question has no universally guaranteed complete output.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 7, "question": "Q7. Consider the following code: ```java Person p1 = new Person(\"John\"); Person p2 = p1; ``` What will be the value of `p2.name` if we change the value of `p1.name` to \"Alice\"?", "options": ["\"John\"", "\"Alice\"", "null", "Compilation error"], "correctIndex": 1, "hint": "", "correctExplanation": "p1 and p2 refer to the same Person object. Changing its name through p1 is visible through p2.", "wrongExplanation": "p1 and p2 refer to the same Person object. Changing its name through p1 is visible through p2."}, {"num": 8, "question": "Q8. MCQ (Coding): What is the output of the following Java code snippet? ```java Integer num1 = 10; Integer num2 = 10; System.out.println(num1 == num2); ```", "options": ["true", "false", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "", "correctExplanation": "Integer values from -128 to 127 are guaranteed to be cached, so both references point to the same cached Integer for 10.", "wrongExplanation": "Integer values from -128 to 127 are guaranteed to be cached, so both references point to the same cached Integer for 10."}, {"num": 9, "question": "Q9. What is the output of the following code snippet? ```java int sum = 0; for (int i = 1; i <= 10; i++) { sum += i; } System.out.println(sum); ```", "options": ["45", "55", "100", "10"], "correctIndex": 1, "hint": "", "correctExplanation": "The loop adds 1 through 10; the arithmetic-series sum is 10 × 11 / 2 = 55.", "wrongExplanation": "The loop adds 1 through 10; the arithmetic-series sum is 10 × 11 / 2 = 55."}, {"num": 10, "question": "Q10. What will be the value of `result` after the following code is executed? ```java int a = 5; int b = 8; int result = (a > b) ? a : b; ```", "options": ["5", "8", "true", "false"], "correctIndex": 1, "hint": "", "correctExplanation": "The condition 5 > 8 is false, so the ternary operator selects b, which is 8.", "wrongExplanation": "The condition 5 > 8 is false, so the ternary operator selects b, which is 8."}, {"num": 11, "question": "Q11. What is the output of the following code snippet? ```java int x = 5; do { System.out.print(x + \" \"); x--; } while (x > 0); ```", "options": ["5 4 3 2 1", "1 2 3 4 5", "5 5 5 5 5", "The code will not compile"], "correctIndex": 0, "hint": "", "correctExplanation": "do-while prints before checking the condition, producing 5 4 3 2 1.", "wrongExplanation": "do-while prints before checking the condition, producing 5 4 3 2 1."}, {"num": 12, "question": "Q12. What is the output of the following code snippet? ```java int n = 1; while (n <= 5) { System.out.print(n + \" \"); n++; } ```", "options": ["1 2 3 4 5", "5 4 3 2 1", "1 1 1 1 1", "5 5 5 5 5"], "correctIndex": 0, "hint": "", "correctExplanation": "The loop prints n from 1 through 5, incrementing n after each print.", "wrongExplanation": "The loop prints n from 1 through 5, incrementing n after each print."}, {"num": 13, "question": "Q13. What is the result of the following ternary expression? `int x = 10; int y = x > 5 ? x + 2 : x - 2;`", "options": ["x is 12", "x is 8", "y is 12", "y is 8"], "correctIndex": 2, "hint": "", "correctExplanation": "10 > 5 is true, so y is assigned x + 2 = 12.", "wrongExplanation": "10 > 5 is true, so y is assigned x + 2 = 12."}, {"num": 14, "question": "Q14. MCQ (Coding): Which of the following statements correctly demonstrates boxing in Java? ```java // Option 1 int num = 42; Integer boxedNum = new Integer(num); // Option 2 int num = 42; Integer boxedNum = Integer.valueOf(num); // Option 3 Integer boxedNum = 42; ```", "options": ["Option 1", "Option 2", "Option 3", "Both Option 1 and Option 2"], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "All three demonstrate boxing: the constructor explicitly wraps the int, valueOf returns an Integer, and assigning an int to Integer uses autoboxing. The Integer(int) constructor is deprecated, but it is still a boxing example.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "All three demonstrate boxing: the constructor explicitly wraps the int, valueOf returns an Integer, and assigning an int to Integer uses autoboxing. The Integer(int) constructor is deprecated, but it is still a boxing example.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 15, "question": "Q15. Consider the following method: ```java public void display(int a, double b) { // Method implementation } ``` Which of the following method calls would be considered as an example of method overloading?", "options": ["display(10, 5.0)", "display(5.0, 10)", "display(10, 10)", "display(10, 10, 5.0)"], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Method overloading is created by declaring another method with the same name and a different parameter list. Merely calling the existing display(int, double) method with different arguments does not declare an overload.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Method overloading is created by declaring another method with the same name and a different parameter list. Merely calling the existing display(int, double) method with different arguments does not declare an overload.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 16, "question": "Q16. What happens if you try to assign a floating-point value to an integer variable in Java without explicit casting?", "options": ["The pr the numeric value 42."}, {"num": 27, "question": "Q27. MCQ (Coding): What is the output of the following Java code snippet? ```java Integer boxedNum = 25; int num = boxedNum; System.out.println(num); ```", "options": ["25", "\"25\"", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "", "correctExplanation": "Assigning Integer to int performs unboxing, yielding primitive 25.", "wrongExplanation": "Assigning Integer to int performs unboxing, yielding primitive 25."}, {"num": 28, "question": "Q28. MCQ (Coding): What is the output of the following Java code snippet? ```java Double value = Double.valueOf(\"3.14\"); System.out.println(value); ```", "options": ["3.14", "\"3.14\"", "Compilation error", "Runtime exception"], "correctIndex": 0, "hint": "", "correctExplanation": "Double.valueOf parses the text into a Double object; println displays 3.14.", "wrongExplanation": "Double.valueOf parses the text into a Double object; println displays 3.14."}, {"num": 29, "question": "Q29. Which of the following is true about the memory allocation of primitive data types and reference data types in Java?", "options": ["Primitive data types are stored on the stack, while reference data types are stored on the heap.", "Both primitive data types and reference data types are stored on the stack.", "Primitive data types are stored on the heap, while reference data types are stored on the stack.", "Both primitive data types and reference data types are stored on the heap."], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Java does not specify that all primitives live on the stack and all reference objects live on the heap. A primitive or reference can be a local variable, instance field or static field; object storage and optimization are JVM implementation details.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original m const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
