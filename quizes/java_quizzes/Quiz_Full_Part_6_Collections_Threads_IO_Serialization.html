    <script>
        const questions = [{"num": 186, "question": "Q186. MCQ: What is the main difference between `ArrayList` and `LinkedList` in Java?", "options": ["`ArrayList` is a resizable array-based implementation, while `LinkedList` is a doubly-linked list-", "`ArrayList` allows null elements, while `LinkedList` does not allow null elements.", "`ArrayList` is a thread-safe collection, while `LinkedList` is not thread-safe.", "`ArrayList` allows constant-time insertion and deletion, while `LinkedList` allows constant-time"], "correctIndex": 0, "hint": "", "correctExplanation": "ArrayList is backed by a resizable array; LinkedList is a doubly linked list. Their access and insertion costs differ.", "wrongExplanation": "ArrayList is backed by a resizable array; LinkedList is a doubly linked list. Their access and insertion costs differ."}, {"num": 187, "question": "Q187. MCQ: What is the purpose of the \"Island of Isolation\" in the context of garbage collection?", "options": ["It refers to a group of objects with circular references that cannot be garbage collected.", "It is a term used to describe objects that are not eligible for garbage collection.", "It is a garbage collection algorithm used by the JVM.", "It refers to a group of objects with strong references that can be garbage collected together."], "correctIndex": 3, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "An island of isolation is a group of objects that reference one another but are unreachable from GC roots. The garbage collector can reclaim them despite their circular references.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "An island of isolation is a group of objects that reference one another but are unreachable from GC roots. The garbage collector can reclaim them despite their circular references.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 188, "question": "Q188. Which Java method is used to add all of the specified elements to the specified collection?", "options": ["addValue()", "copy()", "cpy()", "addAll()"], "correctIndex": 3, "hint": "", "correctExplanation": "Collection.addAll(Collection) adds all elements from the supplied collection to the receiver.", "wrongExplanation": "Collection.addAll(Collection) adds all elements from the supplied collection to the receiver."}, {"num": 189, "question": "Q189. MCQ: Which method is used to sort a collection of objects using a custom `Comparator`?", "options": ["`sort()`", "`Collections.sort()`", "`sorted()`", "`Collections.sorted()`"], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "A List has a sort(Comparator) method, and Collections.sort(list, comparator) is also available. Both APIs can sort with a custom Comparator; the question does not specify which API it means.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "A List has a sort(Comparator) method, and Collections.sort(list, comparator) is also available. Both APIs can sort with a custom Comparator; the question does not specify which API it means.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 190, "question": "Q190. MCQ: What is the return type of a lambda expression that represents a void method?", "options": ["`void`", "`null`", "`None`", "It is inferred by the compiler."], "correctIndex": 3, "hint": "", "correctExplanation": "A void-compatible lambda targets a functional method whose return type is void; the lambda does not return a value.", "wrongExplanation": "A void-compatible lambda targets a functional method whose return type is void; the lambda does not return a value."}, {"num": 191, "question": "Q191. MCQ: What is the main advantage of using `LinkedList` over `ArrayList` in Java?", "options": ["`LinkedList` allows constant-time access to elements by index.", "`LinkedList` allows constant-time insertion and deletion.", "`LinkedList` uses less memory compared to `ArrayList`.", "`LinkedList` allows duplicate elements."], "correctIndex": 1, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "LinkedList can insert or remove a node in constant time once the node/position is reached. Finding an element by index is linear, so it is not generally faster than ArrayList for arbitrary indexed operations.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "LinkedList can insert or remove a node in constant time once the node/position is reached. Finding an element by index is linear, so it is not generally faster than ArrayList for arbitrary indexed operations.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 192, "question": "Q192. MCQ: How does the lambda expression in Java relate to functional interfaces?", "options": ["Lambda expressions can only be used with functional interfaces.", "Lambda expressions are used to define abstract classes in Java.", "Lambda expressions are a replacement for constructors in functional interfaces.", "Lambda expressions can be used with any Java class or interface."], "correctIndex": 0, "hint": "", "correctExplanation": "Lambda expressions are target-typed and used to implement functional interfaces.", "wrongExplanation": "Lambda expressions are target-typed and used to implement functional interfaces."}, {"num": 193, "question": "Q193. MCQ: What is the primary purpose of using lambda expressions in Java?", "options": ["To create new instances of classes.", "To implement abstract methods in interfaces.", "To create anonymous inner classes.", "To improve the performance of the code."], "correctIndex": 1, "hint": "", "correctExplanation": "Lambdas provide concise implementations of functional-interface methods, commonly for callbacks and collection operations.", "wrongExplanation": "Lambdas provide concise implementations of functional-interface methods, commonly for callbacks and collection operations."}, {"num": 194, "question": "Q194. MCQ: What is the purpose of requesting garbage collection in Java?", "options": ["To force the JVM to immediately free up memory.", "To clean up unused objects and reclaim memory.", "To automatically optimize memory usage in the application.", "To stop the execution of the Java program."], "correctIndex": 1, "hint": "", "correctExplanation": "System.gc() requests garbage collection but does not force immediate memory reclamation.", "wrongExplanation": "System.gc() requests garbage collection but does not force immediate memory reclamation."}, {"num": 195, "question": "Q195. MCQ: When would you use a concurrent collection in Java?", "options": ["When you need to perform complex mathematical operations on collection elements.", "When you need to enforce a specific order of elements in the collection.", "When you need to ensure thread safety for accessing and modifying collections from multiple", "When you need to store elements in a sorted order."], "correctIndex": 2, "hint": "", "correctExplanation": "Concurrent collections are designed for safe concurrent access and updates by multiple threads.", "wrongExplanation": "Concurrent collections are designed for safe concurrent access and updates by multiple threads."}, {"num": 196, "question": "Q196. Which Java method is used to clear element of ArrayList?", "options": ["deleteAll()", "delete()", "clearAll()", "clear()"], "correctIndex": 3, "hint": "", "correctExplanation": "ArrayList.clear() removes all elements from the list.", "wrongExplanation": "ArrayList.clear() removes all elements from the list."}, {"num": 197, "question": "Q197. What is garbage collection in java?", "options": ["Method to manage memory in java", "Create new garbage values", "Delete all values", "All of these"], "correctIndex": 0, "hint": "", "correctExplanation": "Garbage collection reclaims heap memory occupied by objects that are no longer reachable.", "wrongExplanation": "Garbage collection reclaims heap memory occupied by objects that are no longer reachable."}, {"num": 198, "question": "Q198. What is a comparator in Java?", "options": ["Interface to compare integer", "Comparison method for lists", "Interface to compare two objects in java", "All of these"], "correctIndex": 2, "hint": "", "correctExplanation": "Comparator<T> is an interface that defines compare(T o1, T o2) for ordering two objects.", "wrongExplanation": "Comparator<T> is an interface that defines compare(T o1, T o2) for ordering two objects."}, {"num": 199, "question": "Q199. MCQ: In lambda expressions, how do you represent a single parameter?", "options": ["(param)", "(param1, param2)", "param", "[param]"], "correctIndex": 2, "hint": "", "correctExplanation": "A single lambda parameter may be written without parentheses when its type is inferred, e.g. x -> x * 2.\nMultithreading & Concurrency", "wrongExplanation": "A single lambda parameter may be written without parentheses when its type is inferred, e.g. x -> x * 2.\nMultithreading & Concurrency"}, {"num": 200, "question": "Q200. MCQ (Coding): Which of the following is a common cause of deadlock in multi-threading?", "options": ["Lack of synchronization in critical sections.", "Excessive use of `sleep()` method.", "Excessive use of `yield()` method.", "Lack of thread priority settings."], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Lack of synchronization is commonly associated with race conditions, not by itself a defining cause of deadlock. Deadlock involves threads waiting cyclically for locks/resources.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Lack of synchronization is commonly associated with race conditions, not by itself a defining cause of deadlock. Deadlock involves threads waiting cyclically for locks/resources.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 201, "question": "Q201. MCQ: Which of the following interfaces in Java is used for creating a thread?", "options": ["`Runnable`", "`Thread`", "`Executor`", "`Timer`"], "correctIndex": 0, "hint": "", "correctExplanation": "Runnable is a functional interface representing a task with a run() method; Thread can execute it.", "wrongExplanation": "Runnable is a functional interface representing a task with a run() method; Thread can execute it."}, {"num": 202, "question": "Q202. MCQ: What happens when a thread calls the `wait()` method in Java?", "options": ["The thread releases the lock on the object's monitor and waits until another thread notifies it.", "The thread continues its execution without any delay.", "The thread enters a waiting state for a specified duration.", "The thread terminates its execution."], "correctIndex": 0, "hint": "", "correctExplanation": "wait() releases the object's monitor and places the calling thread in that object's wait set until notification/interruption/timeout.", "wrongExplanation": "wait() releases the object's monitor and places the calling thread in that object's wait set until notification/interruption/timeout."}, {"num": 203, "question": "Q203. MCQ: Which method is used to temporarily pause the execution of a thread to give other threads a chance to run in Java?", "options": ["`sleep()`", "`join()`", "`yield()`", "`pause()`"], "correctIndex": 2, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Thread.yield() is a scheduler hint that the current thread is willing to yield. The JVM/OS is not required to schedule another thread immediately.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Thread.yield() is a scheduler hint that the current thread is willing to yield. The JVM/OS is not required to schedule another thread immediately.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 204, "question": "Q204. MCQ: Which method is used to pause the execution of a thread for a specific amount of time in Java?", "options": ["`sleep()`", "`join()`", "`yield()`", "`pause()`"], "correctIndex": 0, "hint": "", "correctExplanation": "Thread.sleep(ms) pauses the current thread for at least the requested duration, subject to scheduling.", "wrongExplanation": "Thread.sleep(ms) pauses the current thread for at least the requested duration, subject to scheduling."}, {"num": 205, "question": "Q205. MCQ: What is the role of the `wait()` and `notify()` methods in the producer-consumer problem?", "options": ["The `wait()` method is used by the producer to wait for the consumer to consume data, and the", "The `wait()` method is used by the consumer to wait for the producer to produce data, and the", "Both the `wait()` and `notify()` methods are used by the producer to wait for the consumer to", "Both the `wait()` and `notify()` methods are used by the consumer to wait for the producer to"], "correctIndex": 1, "hint": "", "correctExplanation": "In producer-consumer coordination, the consumer waits while the buffer is empty; the producer notifies after producing data (and vice versa for a full buffer).", "wrongExplanation": "In producer-consumer coordination, the consumer waits while the buffer is empty; the producer notifies after producing data (and vice versa for a full buffer)."}, {"num": 206, "question": "Q206. MCQ (Coding): When do you typically use the `wait()`, `notify()`, and `notifyAll()` methods?", "options": ["When you want to pause a thread for a specific duration.", "When you want to stop the execution of a thread.", "When you want to synchronize access to shared resources.", "When you want to wait for a specific condition to be met."], "correctIndex": 3, "hint": "", "correctExplanation": "wait/notify/notifyAll coordinate threads around a condition guarded by an object's monitor; wait must be called while owning that monitor.", "wrongExplanation": "wait/notify/notifyAll coordinate threads around a condition guarded by an object's monitor; wait must be called while owning that monitor."}, {"num": 207, "question": "Q207. MCQ (Coding): Which method is used to notify a waiting thread to resume execution in Java?", "options": ["`notify()`", "`notifyAll()`", "`resume()`", "`awake()`"], "correctIndex": 0, "hint": "", "correctExplanation": "notify() wakes one thread waiting on that object's monitor; it does not immediately transfer the lock.", "wrongExplanation": "notify() wakes one thread waiting on that object's monitor; it does not immediately transfer the lock."}, {"num": 208, "question": "Q208. MCQ: Which method is used to check if a thread is still alive and running in Java?", "options": ["`isRunning()`", "`isAlive()`", "`isExecuting()`", "`isWorking()`"], "correctIndex": 1, "hint": "", "correctExplanation": "isAlive() reports whether a thread has been started and has not yet terminated.", "wrongExplanation": "isAlive() reports whether a thread has been started and has not yet terminated."}, {"num": 209, "question": "Q209. MCQ: Which method is used to wait for a thread to finish its execution in Java?", "options": ["`sleep()`", "`join()`", "`yield()`", "`wait()`"], "correctIndex": 1, "hint": "", "correctExplanation": "join() makes the calling thread wait for the target thread to terminate.", "wrongExplanation": "join() makes the calling thread wait for the target thread to terminate."}, {"num": 210, "question": "Q210. MCQ: In a deadlock situation, how can you identify which threads are involved?", "options": ["By using the `Thread.getAllStackTraces()` method.", "By analyzing the CPU utilization of each thread.", "By using the `Thread.dumpStack()` method.", "By checking the thread states using the `getState()` method."], "correctIndex": 0, "hint": "⚠️ CDAC Exam Note: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "correctExplanation": "Thread.getAllStackTraces() can enumerate threads and their stack traces. For programmatic deadlock detection, ManagementFactory.getThreadMXBean() provides findDeadlockedThreads() and related methods.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key.", "wrongExplanation": "Thread.getAllStackTraces() can enumerate threads and their stack traces. For programmatic deadlock detection, ManagementFactory.getThreadMXBean() provides findDeadlockedThreads() and related methods.\n\n[CDAC Review Note]: Correction / ambiguity / incomplete item — do not memorise the original marked key."}, {"num": 211, "question": "Q211. MCQ: What is a resource acquisition hierarchy in the context of deadlock?", "options": ["It is a way to prioritize threads based on their resource requirements.", "It is a strategy to break the circular wait condition among threads.", "It is a technique to avoid priority inversion.", "It is a way to grant exclusive access to a resource for only one thread at a time."], "correctIndex": 1, "hint": "", "correctExplanation": "A consistent global lock/resource ordering prevents circular wait, one of the necessary deadlock conditions.", "wrongExplanation": "A consistent global lock/resource ordering prevents circular wait, one of the necessary deadlock conditions."}, {"num": 212, "question": "Q212. MCQ: Which method is used to start the execu options": ["Execute a block of code repeatedly", "Make a decision based on a condition", "Declare variables and methods", "Perform arithmetic operations"], "correctIndex": 1, "hint": "", "correctExplanation": "if evaluates a boolean condition and executes its block when the condition is true.", "wrongExplanation": "if evaluates a boolean condition and executes its block when the condition is true."}];
const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
