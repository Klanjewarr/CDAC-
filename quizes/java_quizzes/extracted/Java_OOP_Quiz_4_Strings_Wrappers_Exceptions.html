<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 4 - Strings, Wrappers, Exceptions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 32px;
        }

        .quiz-container {
            background: white;
            border-radius: 16px;
            box-shadow: none;
            max-width: 520px;
            width: 100%;
            padding: 18px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 640px;
        }

        .quiz-header {
            text-align: left;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: 600;
            color: #232323;
            margin-bottom: 4px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #9d9d9d;
        }

        .progress-text {
            text-align: left;
            font-size: 13px;
            color: #9d9d9d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2a2a2a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options::-webkit-scrollbar {
            width: 6px;
        }

        .options::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
        }

        .option:hover:not(.selected):not(.disabled) {
            border-color: #e6e6e6;
            background: #f6f6f6;
        }

        .option.selected {
            border-color: #d0d0d0;
            background: #dedede;
        }

        .option.correct,
        .option.wrong {
            border-color: #f0f0f0;
            background: #f8f8f8;
        }

        .option.disabled {
            cursor: default;
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            margin-right: 10px;
            flex-shrink: 0;
            color: #9d9d9d;
            width: 22px;
        }

        .option.selected .option-label {
            color: #3a3a3a;
        }

        .option.disabled .option-text {
            color: #bdbdbd;
        }

        .option.disabled .option-label {
            color: #bdbdbd;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3a;
        }


        .feedback-card {
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-card.correct {
            background: #bfeacb;
        }

        .feedback-card.wrong {
            background: #fff7f7;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-header.correct {
            color: #697b6e;
        }

        .feedback-header.wrong {
            color: #a42d22;
        }

        .feedback-icon {
            font-size: 16px;
            font-weight: 600;
        }

        .feedback-answer {
            font-size: 15px;
            color: #2a2a2a;
        }

        .feedback-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback-card.correct .feedback-text {
            color: #444443;
        }

        .feedback-card.wrong .feedback-text {
            color: #2e2e2f;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 52px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .btn-secondary {
            background: #ffffff;
            color: #6b7280;
            border: 1px solid #e2e2e2;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e5e5;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #424cf7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(66, 76, 247, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        .completion-container {
            text-align: center;
            display: none;
        }

        .completion-container.show {
            display: block;
        }

        .completion-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .stat-card.score {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card.score .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.score .stat-value {
            color: white;
        }

        .completion-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4e4e4e;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .hint-toggle .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .hint-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .hint-panel {
            padding: 12px 14px;
            background: #ebecf8;
            border-radius: 12px;
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hint-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hint-title {
            font-weight: 600;
            font-size: 13px;
            color: #4e4e4e;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 13px;
            color: #474749;
            line-height: 1.5;
        }

        .hint-slot {
            min-height: 72px;
        }

        .quiz-footer {
            margin-top: auto;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }
    </style>

        <div class="quiz-header">
            <div class="quiz-title">Quiz 4 - Strings, Wrappers, Exceptions</div>
            <div class="quiz-subtitle">Based on 1 source</div>
        </div>

        <div id="quiz-content">
            <!-- Questions will be rendered here -->
        </div>

        <div id="completion-screen" class="completion-container">
            <div class="completion-icon">🎉</div>
            <div class="completion-title">You did it! Quiz Complete.</div>
            <div class="completion-subtitle">Here's how you performed</div>

            <div class="stats-grid">
                <div class="stat-card score">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score-value">0/14</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="accuracy-value">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Right</div>
                    <div class="stat-value" id="right-value">0</div>
                </div>
                <div class="stat-card">

            </div>

            <div class="completion-buttons">
                <button class="btn btn-secondary" onclick="reviewQuiz()">Review Quiz</button>
                <button class="btn btn-primary" onclick="retakeQuiz()">Retake Quiz</button>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/contrib/auto-render.min.js"></script>
    <script>
        const questions = [{"question": "What is printed?\n\nSystem.out.println(\"Hello\".replace('l','L') + \"Hello\".substring(1,3));", "options": ["HeLLoel", "HeLLolo", "Hello el", "HeLLo"], "correctIndex": 0, "hint": "", "correctExplanation": "replace('l','L') returns a new string \"HeLLo\". substring(1,3) takes indexes 1 and 2 of \"Hello\" = \"el\" (end index is exclusive). Concatenated: HeLLoel.", "wrongExplanation": "replace('l','L') returns a new string \"HeLLo\". substring(1,3) takes indexes 1 and 2 of \"Hello\" = \"el\" (end index is exclusive). Concatenated: HeLLoel."}, {"question": "What is printed? (string pool)\n\nString a = new String(\"Hello\").intern();\nString b = new String(\"Hello\").intern();\nSystem.out.println(a == b);\nString c = new String(\"Hello\");\nString d = new String(\"Hello\");\nSystem.out.println(c == d);", "options": ["false then false", "true then false", "false then true", "true then true"], "correctIndex": 1, "hint": "", "correctExplanation": "intern() returns the pooled copy, so both a and b point to the same pooled \"Hello\" (true). c and d are two separate objects created by new String (false). (Bank Q146 / Q150 / Q158 theme.)", "wrongExplanation": "intern() returns the pooled copy, so both a and b point to the same pooled \"Hello\" (true). c and d are two separate objects created by new String (false). (Bank Q146 / Q150 / Q158 theme.)"}, {"question": "What is printed?\n\nStringBuilder x = new StringBuilder(\"a\"), y = new StringBuilder(\"a\");\nSystem.out.println(x.equals(y) + \" \" + \"a\".equals(\"a\") + \" \" + x.toString().equals(y.toString()));", "options": ["true true true", "true false false", "false false true", "false true true"], "correctIndex": 3, "hint": "", "correctExplanation": "StringBuilder does NOT override equals(), so it compares references (false). String overrides equals() to compare content (true). Comparing the toString() contents also gives true.", "wrongExplanation": "StringBuilder does NOT override equals(), so it compares references (false). String overrides equals() to compare content (true). Comparing the toString() contents also gives true."}, {"question": "What is printed?\n\nSystem.out.println(\"Programming\".indexOf('g') + \" \" + \"Programming\".lastIndexOf('g') + \" \" + \"Programming\".charAt(3));", "options": ["3 9 g", "3 10 g", "4 10 r", "2 10 r"], "correctIndex": 1, "hint": "", "correctExplanation": "\"Programming\" -> P0 r1 o2 g3 r4 a5 m6 m7 i8 n9 g10. indexOf('g') = 3 (first), lastIndexOf('g') = 10, charAt(3) = 'g'.", "wrongExplanation": "\"Programming\" -> P0 r1 o2 g3 r4 a5 m6 m7 i8 n9 g10. indexOf('g') = 3 (first), lastIndexOf('g') = 10, charAt(3) = 'g'."}, {"question": "What happens?\n\nInteger.parseInt(\"12a\");", "options": ["Compile error", "NumberFormatException", "Returns 12", "Returns 0"], "correctIndex": 1, "hint": "", "correctExplanation": "parseInt requires the WHOLE string to be a valid integer. The letter 'a' makes it fail with NumberFormatException (an unchecked exception).", "wrongExplanation": "parseInt requires the WHOLE string to be a valid integer. The letter 'a' makes it fail with NumberFormatException (an unchecked exception)."}, {"question": "What is printed? (valueOf + floating point)\n\nDouble v = Double.valueOf(\"3.14\");\nSystem.out.println(v + 1);", "options": ["4.14", "Compile error", "4.140000000000001", "4"], "correctIndex": 2, "hint": "", "correctExplanation": "Double.valueOf(\"3.14\") auto-unboxes to 3.14 and 1 is added. In binary floating point 3.14 + 1 is 4.140000000000001. Never compare doubles with ==; use BigDecimal for money.", "wrongExplanation": "Double.valueOf(\"3.14\") auto-unboxes to 3.14 and 1 is added. In binary floating point 3.14 + 1 is 4.140000000000001. Never compare doubles with ==; use BigDecimal for money."}, {"question": "What is printed?\n\ntry {\n  int r = 10 / 0;\n  System.out.println(\"no\");\n} catch (ArithmeticException e) {\n  System.out.println(\"catch:\" + e.getMessage());\n} finally {\n  System.out.println(\"finally\");\n}\nSystem.out.println(\"after\");", "options": ["catch:/ by zero, finally, after", "no, finally, after", "Runtime crash after finally", "finally, after"], "correctIndex": 0, "hint": "", "correctExplanation": "10/0 throws ArithmeticException with message '/ by zero', so the print('no') line is skipped. catch handles it, finally always runs, and execution continues normally after the block.", "wrongExplanation": "10/0 throws ArithmeticException with message '/ by zero', so the print('no') line is skipped. catch handles it, finally always runs, and execution continues normally after the block."}, {"question": "What happens? (Bank Q82)\n\ntry {\n  throw new IOException(\"x\");\n} catch (IOException | Exception e) {\n  System.out.println(\"caught\");\n}", "options": ["Runtime exception", "Compile error - alternatives are related by subclassing", "Prints nothing", "Prints caught"], "correctIndex": 1, "hint": "", "correctExplanation": "In a multi-catch (A | B) the alternatives must NOT be related by inheritance. IOException is a subclass of Exception, so Java rejects it. Catch just Exception, or two separate catch blocks (specific first).", "wrongExplanation": "In a multi-catch (A | B) the alternatives must NOT be related by inheritance. IOException is a subclass of Exception, so Java rejects it. Catch just Exception, or two separate catch blocks (specific first)."}, {"question": "What happens when main calls f() with no try/throws?\n\nstatic void f() throws IOException { throw new IOException(); }\nf();", "options": ["Warning only", "Runs and throws IOException", "Prints nothing", "Compile error - unreported checked exception"], "correctIndex": 3, "hint": "", "correctExplanation": "Checked exceptions (IOException, SQLException...) must be caught or declared with throws. The compiler enforces this; unchecked ones (RuntimeException) are not enforced. (Bank Q43 has a similar snippet.)", "wrongExplanation": "Checked exceptions (IOException, SQLException...) must be caught or declared with throws. The compiler enforces this; unchecked ones (RuntimeException) are not enforced. (Bank Q43 has a similar snippet.)"}, {"question": "What is printed?\n\ntry {\n  try { throw new RuntimeException(\"x\"); }\n  finally { System.out.println(\"inner finally\"); }\n} catch (RuntimeException e) {\n  System.out.println(\"outer catch \" + e.getMessage());\n}", "options": ["inner finally then outer catch x", "Compile error", "outer catch x only", "outer catch x then inner finally"], "correctIndex": 0, "hint": "", "correctExplanation": "The exception leaves the inner try only after its finally block runs (cleanup always happens first), then propagates to the outer catch.", "wrongExplanation": "The exception leaves the inner try only after its finally block runs (cleanup always happens first), then propagates to the outer catch."}, {"question": "What happens? (overriding rule)\n\nclass P { void f() { } }\nclass C extends P { void f() throws Exception { } }\nnew C();", "options": ["Compile error - overriding method cannot throw a broader checked exception", "Runtime error only when f() is called", "Compiles fine", "Warning only"], "correctIndex": 0, "hint": "", "correctExplanation": "An overriding method may throw the same checked exceptions, narrower ones, or none - never a broader/new checked one. Here C.f() throws Exception while P.f() declares none, so it does not compile.", "wrongExplanation": "An overriding method may throw the same checked exceptions, narrower ones, or none - never a broader/new checked one. Here C.f() throws Exception while P.f() declares none, so it does not compile."}, {"question": "Which of the following is a CHECKED exception?", "options": ["NullPointerException", "ArrayIndexOutOfBoundsException", "IOException", "ArithmeticException"], "correctIndex": 2, "hint": "", "correctExplanation": "Checked = subclasses of Exception that are not RuntimeException (IOException, SQLException, InterruptedException...). The other three extend RuntimeException (unchecked). Errors (StackOverflowError) are also unchecked.", "wrongExplanation": "Checked = subclasses of Exception that are not RuntimeException (IOException, SQLException, InterruptedException...). The other three extend RuntimeException (unchecked). Errors (StackOverflowError) are also unchecked."}, {"question": "What is printed?\n\nStringBuilder sb = new StringBuilder(\"abcdef\");\nsb.delete(1, 3).insert(1, \"XY\").append(sb.length());\nSystem.out.println(sb);", "options": ["abXYcdef6", "aXYdef5", "aXYdef", "aXYdef6"], "correctIndex": 3, "hint": "", "correctExplanation": "delete(1,3) removes indexes 1-2 (b,c) -> \"adef\". insert(1,\"XY\") -> \"aXYdef\". append(sb.length()) appends the length at that moment, 6. StringBuilder methods return 'this', so the chain edits one object.", "wrongExplanation": "delete(1,3) removes indexes 1-2 (b,c) -> \"adef\". insert(1,\"XY\") -> \"aXYdef\". append(sb.length()) appends the length at that moment, 6. StringBuilder methods return 'this', so the chain edits one object."}, {"question": "What is printed? (split)\n\nSystem.out.println(\"a1b22c333\".split(\"\\\\d+\").length);", "options": ["4", "5", "3", "6"], "correctIndex": 2, "hint": "", "correctExplanation": "split(\"\\\\d+\") splits on runs of digits: \"a\", \"b\", \"c\". The trailing empty string is dropped, giving length 3.", "wrongExplanation": "split(\"\\\\d+\") splits on runs of digits: \"a\", \"b\", \"c\". The trailing empty string is dropped, giving length 3."}];
        const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
</body>
</html>
