<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 6 - Threads, File IO, Serialization, JDBC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 32px;
        }

        .quiz-container {
            background: white;
            border-radius: 16px;
            box-shadow: none;
            max-width: 520px;
            width: 100%;
            padding: 18px 16px 20px;
            display: flex;
            flex-direction: column;
            min-height: 640px;
        }

        .quiz-header {
            text-align: left;
            margin-bottom: 16px;
        }

        .quiz-title {
            font-size: 22px;
            font-weight: 600;
            color: #232323;
            margin-bottom: 4px;
        }

        .quiz-subtitle {
            font-size: 13px;
            color: #9d9d9d;
        }

        .progress-text {
            text-align: left;
            font-size: 13px;
            color: #9d9d9d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 16px;
            font-weight: 500;
            color: #2a2a2a;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .options::-webkit-scrollbar {
            width: 6px;
        }

        .options::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 3px;
        }

        .options::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8f8f8;
        }

        .option:hover:not(.selected):not(.disabled) {
            border-color: #e6e6e6;
            background: #f6f6f6;
        }

        .option.selected {
            border-color: #d0d0d0;
            background: #dedede;
        }

        .option.correct,
        .option.wrong {
            border-color: #f0f0f0;
            background: #f8f8f8;
        }

        .option.disabled {
            cursor: default;
        }

        .option-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            margin-right: 10px;
            flex-shrink: 0;
            color: #9d9d9d;
            width: 22px;
        }

        .option.selected .option-label {
            color: #3a3a3a;
        }

        .option.disabled .option-text {
            color: #bdbdbd;
        }

        .option.disabled .option-label {
            color: #bdbdbd;
        }

        .option-text {
            flex: 1;
            font-size: 15px;
            color: #3a3a3a;
        }


        .feedback-card {
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .feedback-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feedback-card.correct {
            background: #bfeacb;
        }

        .feedback-card.wrong {
            background: #fff7f7;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .feedback-header.correct {
            color: #697b6e;
        }

        .feedback-header.wrong {
            color: #a42d22;
        }

        .feedback-icon {
            font-size: 16px;
            font-weight: 600;
        }

        .feedback-answer {
            font-size: 15px;
            color: #2a2a2a;
        }

        .feedback-text {
            font-size: 13px;
            line-height: 1.5;
        }

        .feedback-card.correct .feedback-text {
            color: #444443;
        }

        .feedback-card.wrong .feedback-text {
            color: #2e2e2f;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            min-height: 52px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            min-width: 120px;
        }

        .btn-secondary {
            background: #ffffff;
            color: #6b7280;
            border: 1px solid #e2e2e2;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e5e5e5;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #424cf7;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(66, 76, 247, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }


        .completion-container {
            text-align: center;
            display: none;
        }

        .completion-container.show {
            display: block;
        }

        .completion-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 12px;
        }

        .completion-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .stat-card.score {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .stat-card.score .stat-label {
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-card.score .stat-value {
            color: white;
        }

        .completion-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .hint-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #4e4e4e;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .hint-toggle .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .hint-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .hint-panel {
            padding: 12px 14px;
            background: #ebecf8;
            border-radius: 12px;
            display: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .hint-panel.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hint-title {
            font-weight: 600;
            font-size: 13px;
            color: #4e4e4e;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 13px;
            color: #474749;
            line-height: 1.5;
        }

        .hint-slot {
            min-height: 72px;
        }

        .quiz-footer {
            margin-top: auto;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }
    </style>

        <div id="quiz-content">
            <!-- Questions will be rendered here -->
        </div>

        <div id="completion-screen" class="completion-container">
            <div class="completion-icon">🎉</div>
            <div class="completion-title">You did it! Quiz Complete.</div>
            <div class="completion-subtitle">Here's how you performed</div>

            <div class="stats-grid">
                <div class="stat-card score">

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.18/dist/contrib/auto-render.min.js"></script>
    <script>
        const questions = [{"question": "What is printed?\n\nThread t = new Thread(() -> System.out.println(\"child\"));\nt.start();\nt.join();\nSystem.out.println(\"main\");", "options": ["main only", "main then child", "child then main", "Order is random"], "correctIndex": 2, "hint": "", "correctExplanation": "t.join() makes the main thread WAIT until t finishes, so child is always printed first. Without join the order would be unpredictable.", "wrongExplanation": "t.join() makes the main thread WAIT until t finishes, so child is always printed first. Without join the order would be unpredictable."}, {"question": "What happens on the second start()?\n\nThread t = new Thread(() -> { });\nt.start();\nt.join();\nt.start();", "options": ["IllegalThreadStateException", "Compile error", "Nothing", "Runs the thread again"], "correctIndex": 0, "hint": "", "correctExplanation": "A thread can be started only once. After it has run (or even started) it can never be restarted; create a new Thread object.", "wrongExplanation": "A thread can be started only once. After it has run (or even started) it can never be restarted; create a new Thread object."}, {"question": "What is printed?\n\nThread t = new Thread(() -> System.out.println(Thread.currentThread().getName()), \"worker\");\nt.start();\nt.join();", "options": ["worker", "main", "Nothing", "Thread-0"], "correctIndex": 0, "hint": "", "correctExplanation": "The second constructor argument sets the thread's name. start() runs the lambda on the NEW thread, whose name is worker. (Calling run() directly would print main.)", "wrongExplanation": "The second constructor argument sets the thread's name. start() runs the lambda on the NEW thread, whose name is worker. (Calling run() directly would print main.)"}, {"question": "What is printed?\n\nstatic int count = 0;\nstatic synchronized void inc() { count++; }\nThread a = new Thread(() -> { for (int i = 0; i < 1000; i++) inc(); });\nThread b = new Thread(() -> { for (int i = 0; i < 1000; i++) inc(); });\na.start(); b.start(); a.join(); b.join();\nSystem.out.println(count);", "options": ["Random", "2000", "Always less than 2000", "1000"], "correctIndex": 1, "hint": "", "correctExplanation": "synchronized makes inc() mutually exclusive, so no increments are lost; join waits for both threads. Without synchronized, count++ (read-modify-write) is not atomic and the result could be below 2000 (race condition).", "wrongExplanation": "synchronized makes inc() mutually exclusive, so no increments are lost; join waits for both threads. Without synchronized, count++ (read-modify-write) is not atomic and the result could be below 2000 (race condition)."}, {"question": "What is the difference between sleep() and wait()?", "options": ["No difference", "Both release the lock", "wait() keeps the lock; sleep() releases it", "sleep() keeps holding the lock; wait() releases the lock and must be in a synchronized block"], "correctIndex": 3, "hint": "", "correctExplanation": "Thread.sleep pauses the current thread for a time but KEEPS any monitor it holds. Object.wait releases the monitor and waits until notify/notifyAll (or timeout); it must be called inside synchronized code or you get IllegalMonitorStateException.", "wrongExplanation": "Thread.sleep pauses the current thread for a time but KEEPS any monitor it holds. Object.wait releases the monitor and waits until notify/notifyAll (or timeout); it must be called inside synchronized code or you get IllegalMonitorStateException."}, {"question": "What is the default priority of the main thread?\n\nSystem.out.println(Thread.currentThread().getPriority());", "options": ["0", "5", "1", "10"], "correctIndex": 1, "hint": "", "correctExplanation": "Priorities range from MIN=1 to MAX=10, with NORM_PRIORITY=5 as the default. A new thread inherits its creator's priority. Priorities are only hints to the scheduler.", "wrongExplanation": "Priorities range from MIN=1 to MAX=10, with NORM_PRIORITY=5 as the default. A new thread inherits its creator's priority. Priorities are only hints to the scheduler."}, {"question": "What is printed?\n\nThread t = new Thread(() -> { });\nSystem.out.println(t.getState());\nt.start();\nt.join();\nSystem.out.println(t.getState());", "options": ["NEW then RUNNABLE", "TERMINATED then NEW", "NEW then TERMINATED", "RUNNABLE then TERMINATED"], "correctIndex": 2, "hint": "", "correctExplanation": "Before start() the state is NEW. After start() and join(), the thread has finished: TERMINATED. Other states: RUNNABLE, BLOCKED, WAITING, TIMED_WAITING.", "wrongExplanation": "Before start() the state is NEW. After start() and join(), the thread has finished: TERMINATED. Other states: RUNNABLE, BLOCKED, WAITING, TIMED_WAITING."}, {"question": "What happens?\n\nnew ConcurrentHashMap<String, Integer>().put(\"a\", null);", "options": ["Compile error", "Silently ignored", "NullPointerException", "Stores null"], "correctIndex": 2, "hint": "", "correctExplanation": "ConcurrentHashMap (like Hashtable) forbids null keys and null values, because null would be ambiguous in concurrent get(). HashMap allows them.", "wrongExplanation": "ConcurrentHashMap (like Hashtable) forbids null keys and null values, because null would be ambiguous in concurrent get(). HashMap allows them."}, {"question": "What is printed? (transient)\n\nclass User implements Serializable {\n  String name; transient String pass;\n  User(String n, String p) { name = n; pass = p; }\n}\nByteArrayOutputStream bo = new ByteArrayOutputStream();\ntry (ObjectOutputStream o = new ObjectOutputStream(bo)) {\n  o.writeObject(new User(\"ali\", \"secret\"));\n}\ntry (ObjectInputStream in = new ObjectInputStream(new ByteArrayInputStream(bo.toByteArray()))) {\n  User u = (User) in.readObject();\n  System.out.println(u.name + \" \" + u.pass);\n}", "options": ["Compile error", "ali null", "null null", "ali secret"], "correctIndex": 1, "hint": "", "correctExplanation": "transient fields are skipped during serialization and come back as the default value (null for a String). static fields are not serialized either.", "wrongExplanation": "transient fields are skipped during serialization and come back as the default value (null for a String). static fields are not serialized either."}, {"question": "What happens?\n\nclass Plain { }\nnew ObjectOutputStream(new ByteArrayOutputStream()).writeObject(new Plain());", "options": ["Writes null", "NotSerializableException", "Compile error", "Writes an empty file"], "correctIndex": 1, "hint": "", "correctExplanation": "Only objects whose class implements java.io.Serializable (a marker interface) can be written. Plain has no such interface, so writeObject throws NotSerializableException at runtime.", "wrongExplanation": "Only objects whose class implements java.io.Serializable (a marker interface) can be written. Plain has no such interface, so writeObject throws NotSerializableException at runtime."}, {"question": "What is printed?\n\nBufferedReader br = new BufferedReader(new StringReader(\"l1\\nl2\"));\nSystem.out.println(br.readLine());\nSystem.out.println(br.readLine());\nSystem.out.println(br.readLine());", "options": ["l1 l2 forever", "l1 then l2", "Compile error", "l1 then l2 then null"], "correctIndex": 3, "hint": "", "correctExplanation": "readLine returns one line per call and null at the end of input - that null is the standard loop-termination signal: while ((line = br.readLine()) != null).", "wrongExplanation": "readLine returns one line per call and null at the end of input - that null is the standard loop-termination signal: while ((line = br.readLine()) != null)."}, {"question": "What is printed? (FileWriter append flag)\n\nFile f = File.createTempFile(\"tmp\", \".txt\");\ntry (FileWriter w = new FileWriter(f)) { w.write(\"A\"); }\nSystem.out.println(Files.readString(f.toPath()));\ntry (FileWriter w = new FileWriter(f, true)) { w.write(\"B\"); }\nSystem.out.println(Files.readString(f.toPath()));\ntry (FileWriter w = new FileWriter(f)) { w.write(\"C\"); }\nSystem.out.println(Files.readString(f.toPath()));", "options": ["A then B then C", "AB then AB then C", "A then AB then C", "A then AB then ABC"], "correctIndex": 2, "hint": "", "correctExplanation": "new FileWriter(f) OVERWRITES the file (A). new FileWriter(f, true) APPENDS (AB). A third default FileWriter overwrites again, leaving only C.", "wrongExplanation": "new FileWriter(f) OVERWRITES the file (A). new FileWriter(f, true) APPENDS (AB). A third default FileWriter overwrites again, leaving only C."}, {"question": "Which JDBC object best PREVENTS SQL injection? (the DAO pattern usually wraps it)", "options": ["PreparedStatement with ? parameters", "ResultSet", "Statement with string concatenation", "DriverManager"], "correctIndex": 0, "hint": "", "correctExplanation": "PreparedStatement sends the SQL and the values separately: ? parameters are always treated as data, never as SQL. Concatenating user input into a Statement is how injection happens. A DAO (Data Access Object) hides this JDBC code behind an interface so business logic never touches SQL.", "wrongExplanation": "PreparedStatement sends the SQL and the values separately: ? parameters are always treated as data, never as SQL. Concatenating user input into a Statement is how injection happens. A DAO (Data Access Object) hides this JDBC code behind an interface so business logic never touches SQL."}, {"question": "What do executeQuery(), executeUpdate() and execute() return?", "options": ["boolean, boolean, boolean", "int, ResultSet, void", "ResultSet, ResultSet, int", "ResultSet, int (rows affected), boolean"], "correctIndex": 3, "hint": "", "correctExplanation": "executeQuery (SELECT) -> ResultSet. executeUpdate (INSERT/UPDATE/DELETE/DDL) -> int row count. execute (any SQL) -> boolean: true if the first result is a ResultSet.", "wrongExplanation": "executeQuery (SELECT) -> ResultSet. executeUpdate (INSERT/UPDATE/DELETE/DDL) -> int row count. execute (any SQL) -> boolean: true if the first result is a ResultSet."}, {"question": "A ResultSet row holds name in the FIRST column. Which call reads it?", "options": ["rs.getString(1)", "rs.getColumn(1)", "rs.getString(0)", "rs.get(first)"], "correctIndex": 0, "hint": "", "correctExplanation": "JDBC column indexes start at 1 (unlike arrays). getString(0) throws SQLException. You can also use the column label: rs.getString(\"name\"). Remember to call rs.next() first to move onto a row.", "wrongExplanation": "JDBC column indexes start at 1 (unlike arrays). getString(0) throws SQLException. You can also use the column label: rs.getString(\"name\"). Remember to call rs.next() first to move onto a row."}];
        const totalQuestions = questions.length;
        let currentQuestionIndex = 0;
        let userAnswers = []; // Store user's answers {questionIndex, selectedIndex, isCorrect}
        let isReviewMode = false;

        function renderMath(target) {
            if (!target || typeof renderMathInElement !== 'function') return;
            renderMathInElement(target, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\(', right: '\)', display: false},
                    {left: '\[', right: '\]', display: true}
                ],
                throwOnError: false
            });
        }

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const quizContent = document.getElementById('quiz-content');
            const question = questions[currentQuestionIndex];
            const userAnswer = userAnswers[currentQuestionIndex];

            const isAnswered = userAnswer !== undefined;

            // Determine button states
            const showPrevious = currentQuestionIndex > 0;
            const showNext = isAnswered && currentQuestionIndex < totalQuestions - 1;
            const showFinish = isAnswered && currentQuestionIndex === totalQuestions - 1 && !isReviewMode;
            const showFinishReview = isReviewMode && currentQuestionIndex === totalQuestions - 1;
            const showHint = !!question.hint;

            let optionsHtml = '';
            question.options.forEach((option, index) => {
                const letter = String.fromCharCode(65 + index); // A, B, C, D

                if (isAnswered) {
                    if (index === question.correctIndex) {
                        const correctExplain = question.correctExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card correct show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header correct">
                                    <span class="feedback-icon">✓</span>
                                    <span>Right answer</span>
                                </div>
                                <div class="feedback-text">${correctExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    if (!userAnswer.isCorrect && index === userAnswer.selectedIndex) {
                        const wrongExplain = question.wrongExplanation || question.explanation || '';
                        optionsHtml += `
                            <div class="feedback-card wrong show">
                                <div class="feedback-answer">${letter}. ${option}</div>
                                <div class="feedback-header wrong">
                                    <span class="feedback-icon">✕</span>
                                    <span>Not quite</span>
                                </div>
                                <div class="feedback-text">${wrongExplain}</div>
                            </div>
                        `;
                        return;
                    }

                    optionsHtml += `
                        <div class="option disabled" data-index="${index}">
                            <span class="option-label">${letter}.</span>
                            <span class="option-text">${option}</span>
                        </div>
                    `;
                    return;
                }

                const optionClass = index === (userAnswer ? userAnswer.selectedIndex : -1) ? 'option selected' : 'option';
                optionsHtml += `
                    <div class="${optionClass}" onclick="selectAnswer(${index})" data-index="${index}">
                        <span class="option-label">${letter}.</span>
                        <span class="option-text">${option}</span>
                    </div>
                `;
            });

            let hintHtml = '';
            if (showHint) {
                hintHtml = `
                    <button class="hint-toggle" id="hint-toggle" onclick="toggleHint()">
                        <span>Hint</span>
                        <span class="chevron">⌃</span>
                    </button>
                    <div id="hint-panel" class="hint-panel">
                        <div class="hint-title">Hint</div>
                        <div class="hint-text">${question.hint}</div>
                    </div>
                `;
            }

            let buttonsHtml = `
                <div class="quiz-footer">
                    <div class="buttons">
                        <div style="display: flex; gap: 12px;">
                            <button class="btn btn-secondary" onclick="previousQuestion()" ${showPrevious ? '' : 'disabled'}>
                                Previous
                            </button>
                        </div>
                        <div>
                            ${showNext ? '<button class="btn btn-primary" onclick="nextQuestion()">Next</button>' : ''}
                            ${showFinish ? '<button class="btn btn-primary" onclick="finishQuiz()">Finish Quiz</button>' : ''}
                            ${showFinishReview ? '<button class="btn btn-primary" onclick="finishReview()">Finish Review</button>' : ''}
                        </div>
                    </div>
                </div>
            `;

            quizContent.innerHTML = `
                <div class="progress-text">${currentQuestionIndex + 1} / ${totalQuestions}</div>
                <div class="question-text">${question.question}</div>
                <div class="options">
                    ${optionsHtml}
                </div>
                <div class="hint-slot">
                    ${hintHtml}
                </div>
                ${buttonsHtml}
            `;
            renderMath(quizContent);
        }

        function selectAnswer(selectedIndex) {
            const question = questions[currentQuestionIndex];
            const isCorrect = selectedIndex === question.correctIndex;

            // Store the answer
            userAnswers[currentQuestionIndex] = {
                questionIndex: currentQuestionIndex,
                selectedIndex: selectedIndex,
                isCorrect: isCorrect
            };

            // Re-render to show feedback
            renderQuestion();
        }

        function toggleHint() {
            const hintPanel = document.getElementById('hint-panel');
            const hintToggle = document.getElementById('hint-toggle');
            if (hintPanel) {
                hintPanel.classList.toggle('show');
            }
            if (hintToggle) {
                hintToggle.classList.toggle('open');
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        function finishQuiz() {
            showCompletionScreen();
        }

        function showCompletionScreen() {
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            // Calculate stats
            const answeredQuestions = userAnswers.filter(a => a !== undefined);
            const correctAnswers = userAnswers.filter(a => a && a.isCorrect).length;
            const wrongAnswers = userAnswers.filter(a => a && !a.isCorrect).length;
            const skipped = totalQuestions - answeredQuestions.length;
            const accuracy = answeredQuestions.length > 0
                ? Math.round((correctAnswers / answeredQuestions.length) * 100)
                : 0;

            // Update stats
            document.getElementById('score-value').textContent = `${correctAnswers}/${totalQuestions}`;
            document.getElementById('accuracy-value').textContent = `${accuracy}%`;
            document.getElementById('right-value').textContent = correctAnswers;
            document.getElementById('wrong-value').textContent = wrongAnswers;
            document.getElementById('skipped-value').textContent = skipped;

            // Show completion screen
            quizContent.style.display = 'none';
            completionScreen.classList.add('show');
        }

        function reviewQuiz() {
            isReviewMode = true;
            currentQuestionIndex = 0;
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        function finishReview() {
            showCompletionScreen();
        }

        function retakeQuiz() {
            isReviewMode = false;
            currentQuestionIndex = 0;
            userAnswers = [];
            const quizContent = document.getElementById('quiz-content');
            const completionScreen = document.getElementById('completion-screen');

            quizContent.style.display = 'block';
            completionScreen.classList.remove('show');
            renderQuestion();
        }

        // Initialize quiz on page load
        initQuiz();
    </script>
</body>
</html>
